name: Bug
description: Something in the widget or the server behaves incorrectly.
labels: [bug]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [local, server, both, not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The challenge is drawn at random, so mention which rung you were on.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, and Node version if this is server side
      placeholder: Safari 18, Node 22
