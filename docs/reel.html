<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tech-captcha reel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Two modes. Open it plain and it plays a scripted run you can screen
         record. Add ?frame=N&seed=S and it renders exactly the state at that
         frame with no animation, which is what scripts/capture-reel.sh feeds
         to headless Chrome to build the GIF. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d0d0f;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 70px;
        background: radial-gradient(120% 120% at 50% 0%, #f7f8fa 0%, #e9ebef 100%);
        overflow: hidden;
      }
      tech-captcha {
        transform-origin: top center;
        transition: transform 420ms cubic-bezier(0.33, 1, 0.68, 1);
      }
      body.static tech-captcha { transition: none; }
      .cursor {
        position: absolute;
        top: 0;
        left: 0;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        border-radius: 50%;
        background: rgba(24, 24, 27, 0.85);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.38);
        pointer-events: none;
        opacity: 0;
        z-index: 10;
        transition: transform 620ms cubic-bezier(0.33, 1, 0.68, 1), opacity 200ms ease;
      }
      body.static .cursor { transition: none; }
      .cursor.tap { transform: scale(0.55); transition-duration: 110ms; }
      .hint {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #9aa0a6;
      }
      .hint.hidden { display: none; }
    </style>
  </head>
  <body>
    <script>
      // Classic script, so this runs before the deferred module below and any
      // shuffle it performs. Re-callable, because capture mode reseeds before
      // every frame: same seed, same draw, so frame 40 and frame 41 are the
      // same run one tick apart rather than two different runs.
      window.__seed = function (seed) {
        var s = 0
        for (var i = 0; i < String(seed).length; i++) s = (s * 31 + String(seed).charCodeAt(i)) >>> 0
        s = s || 1
        Math.random = function () {
          s ^= s << 13; s >>>= 0
          s ^= s >> 17
          s ^= s << 5; s >>>= 0
          return s / 4294967296
        }
      }
      ;(function () {
        var seed = new URLSearchParams(location.search).get('seed')
        if (seed !== null) window.__seed(seed)
      })()
    </script>

    <div class="stage">
      <tech-captcha pack="sf"></tech-captcha>
      <div class="cursor"></div>
      <div class="hint">press R to replay, H to hide this line</div>
    </div>

    <script type="module">
      import '/src/index.ts'
      import { sanFrancisco } from '/src/packs/sf/index.ts'

      const params = new URLSearchParams(location.search)
      const frame = params.has('frame') ? Number(params.get('frame')) : null
      const fps = Number(params.get('fps') ?? 10)
      const once = params.has('once')
      const still = frame !== null || params.has('capture')

      let el = document.querySelector('tech-captcha')
      const cursor = document.querySelector('.cursor')
      const stage = document.querySelector('.stage')
      const hint = document.querySelector('.hint')
      if (still) {
        document.body.classList.add('static')
        hint.remove()
      }

      const wait = (ms) => (still ? Promise.resolve() : new Promise((r) => setTimeout(r, ms)))

      /* Still mode collapses every wait, so the widget measures an elapsed
         time of zero and the letter is stamped "0.0s". Hand it a clock that
         follows the script instead: the timings on the card are then the ones
         the run would really have taken. */
      let virtualNow = 0
      if (still) performance.now = () => virtualNow
      /* Verify is async: the driver grades, then the element re-renders. Still
         mode collapses every wait to nothing, so the script has to watch for
         the change rather than assume a number of ticks covers it. Reading the
         old board is silent and fatal: the reel picks tiles that no longer
         exist, selects nothing, and Verify stays disabled for the rest of the
         run. */
      const tick = () => new Promise((r) => setTimeout(r, 0))
      async function settle(previous) {
        for (let i = 0; i < 60; i++) {
          await tick()
          const now = q('.subject')?.textContent
          if (now !== previous || sr().querySelector('canvas.letter')) return
        }
      }
      const sr = () => el.shadowRoot
      const q = (s) => sr().querySelector(s)
      const tiles = () => [...sr().querySelectorAll('.tile')]

      const room = () => stage.clientHeight - 140
      const fit = () => {
        const natural = el.offsetHeight
        if (natural) el.style.transform = `scale(${Math.min(1.95, Math.max(1, room() / natural))})`
      }
      new ResizeObserver(fit).observe(el)

      const allTiles = [...sanFrancisco.ladder, ...sanFrancisco.finale].flatMap((c) => c.tiles)
      const isRight = (node) =>
        allTiles.find((t) => t.text === node.getAttribute('aria-label'))?.correct === true

      function trapIndex() {
        const match = (q('.injection')?.textContent ?? '').match(/square (\d+)/)
        return match ? Number(match[1]) - 1 : -1
      }

      /* Tiles the reel is willing to click. Never the planted one, since
         obeying it ends every run as BOT rather than as a person failing. And
         never one already selected: clicking it again deselects it, and an
         empty selection leaves Verify disabled, so the run would stall. */
      const candidates = (right) =>
        tiles().filter(
          (t, i) =>
            i !== trapIndex() &&
            isRight(t) === right &&
            t.getAttribute('aria-pressed') !== 'true',
        )

      let position = null
      function place(node, progress = 1) {
        const box = node.getBoundingClientRect()
        const stageBox = stage.getBoundingClientRect()
        const to = {
          x: box.left - stageBox.left + box.width / 2,
          y: box.top - stageBox.top + box.height / 2,
        }
        const from = position ?? to
        const at = still
          ? { x: from.x + (to.x - from.x) * progress, y: from.y + (to.y - from.y) * progress }
          : to
        cursor.style.opacity = '1'
        cursor.style.transform = `translate(${at.x}px, ${at.y}px)`
        if (progress === 1) position = to
      }

      /* The run, as data. Live mode plays it with real waits; still mode walks
         it with none and stops at the requested frame. */
      const script = [
        { hold: 1600 },
        { pick: 'wrong' },
        { pick: 'wrong' },
        { verify: true },
        { hold: 1300 },
        { pick: 'wrong' },
        { verify: true },
        { hold: 2500 },
        { pick: 'right' },
        { verify: true },
        { hold: 4000, end: true },
      ]
      const MOVE = 660
      const TAP = 380
      const stepMs = (s) => (s.hold ? s.hold : MOVE + TAP)

      async function run(target) {
        let clock = 0

        for (const step of script) {
          const span = stepMs(step)

          if (step.hold) {
            if (still && target < clock + span) { virtualNow = target; return }
            clock += span
            virtualNow = clock
            await wait(span)
            if (step.end) {
              cursor.style.opacity = '0'
              if (!still && !once) location.reload()
            }
            continue
          }

          const node = step.verify ? q('.verify') : candidates(step.pick === 'right')[0]
          if (!node) { clock += span; continue }

          // Mid-move: draw the cursor part way and stop.
          if (still && target < clock + MOVE) {
            virtualNow = target
            place(node, Math.max(0, (target - clock) / MOVE))
            return
          }
          if (still && target < clock + span) { virtualNow = target; place(node); return }

          place(node)
          await wait(MOVE)
          cursor.classList.add('tap')
          await wait(130)
          const before = q('.subject')?.textContent
          node.click()
          cursor.classList.remove('tap')
          await wait(TAP - 130)
          clock += span
          virtualNow = clock
          if (step.verify) await settle(before)
        }
      }

      addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') location.reload()
        if (e.key.toLowerCase() === 'h') hint.classList.toggle('hidden')
      })

      /* Capture mode. One browser, one page: scripts/capture-reel.mjs calls
         this per frame over CDP and screenshots between calls. Recreating the
         element is what guarantees a clean slate, since the widget carries
         attempt counts and a drawn ladder that reset() alone would reroll. */
      window.__frame = async (n, seed) => {
        // Before the element exists: the driver stamps its start time in its
        // constructor, so resetting the clock afterwards reads as negative.
        virtualNow = 0
        window.__seed(seed)
        const fresh = document.createElement('tech-captcha')
        fresh.setAttribute('pack', 'sf')
        el.replaceWith(fresh)
        el = fresh
        new ResizeObserver(fit).observe(el)
        position = null
        cursor.style.opacity = '0'
        for (let i = 0; i < 200 && !sr()?.querySelector('.tile'); i++) await tick()
        await run((n * 1000) / fps)
        fit()
        await tick()
      }

      if (!params.has('capture')) {
        await wait(500)
        await run(still ? (frame * 1000) / fps : Infinity)
        fit()
      }
      document.documentElement.dataset.ready = '1'
    </script>
  </body>
</html>
